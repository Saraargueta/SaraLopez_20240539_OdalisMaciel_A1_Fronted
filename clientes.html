<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent Express</title>
</head>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold"></span>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Reservas</a>
            <a class="nav-link active fw-bold" href="clientes.html">Clientes</a>
        </div>
    </div>
</nav>

    <main class="container py-5">

        <section class="text-center mb-5 text-dark">
            <h1 class="fw-bold mb-3">Gestión de Clientes</h1>
            <p class="lead text-muted"></p>
        </section>

        <div class="main-container p-4">

            <section class="card shadow-sm mb-5">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0" id="formTitle">Agregar o Editar Cliente</h2>
                </div>

                <div class="card-body">
                    <form id="formRegistro">

                        <input type="hidden" id="txtId">

                        <div class="form-group my-3">
                            <label for="txtNombre" class="form-label">Nombre </label>
                            <input type="text" id="txtNombre" class="form-control" placeholder="Ej: Juan" required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtApellido" class="form-label">Apellido </label>
                            <input type="text" id="txtApellido" class="form-control" placeholder="Ej: Pérez" required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtTelefono" class="form-label">Teléfono </label>
                            <input type="text" id="txtTelefono" class="form-control" placeholder="Ej: 7777-7777" required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtEmail" class="form-label">Email </label>
                            <input type="email" id="txtEmail" class="form-control" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtDireccion" class="form-label">Dirección</label>
                            <input type="text" id="txtDireccion" class="form-control" placeholder="Dirección del cliente">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                            <button type="submit" id="btnGuardar" class="btn btn-primary btn-lg">Guardar </button>
                            <button id="btnCancelar" class="btn btn-warning btn-lg d-none" type="button">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h2 class="h5 mb-0">Lista de Clientes</h2>
                    <button id="btnRecargar" class="btn btn-light btn-sm"> Recargar</button>
                </div>

                <div class="card-body">

                    <div id="mensaje" class="alert d-none" role="alert"></div>

                    <div id="cargando" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando.</span>
                        </div>
                        <p class="mt-3 text-muted">Cargando registros.</p>
                    </div>

                    <div class="table-responsive d-none" id="tableroContainer">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Dirección</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaRegistros">
                            </tbody>
                        </table>
                    </div>

                </div>
            </section>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/controllers/clientesController.js"></script>

</body>

</html>
