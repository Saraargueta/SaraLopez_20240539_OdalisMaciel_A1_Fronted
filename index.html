<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
</head>
<body>


    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">AutoRent Express</span>
        <div class="navbar-nav">
            <a class="nav-link active fw-bold" href="index.html">Modulo de Gestion de Reservas</a>
            <a class="nav-link" href="clientes.html">Clientes</a>
        </div>
    </div>
</nav>

    <main class="container py-5">

        <section class="text-center mb-5 text-dark">
            <h1 class="fw-bold mb-3">Gestión de clientes</h1>
            <p class="lead text-muted"></p>
        </section>

    <div class="main-container p-4">

    <section class="card shadow-sm mb-5">
     <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Agregar o Editar Reserva</h2>
    </div>
    <div class="card-body">
    <form id="formRegistro">
        <input type="hidden" id="txtId">
            <div class="form-group my-3">
                <label for="selectCliente" class="form-label">Cliente</label>
                <select id="selectCliente" class="form-select" required>
                    <option value="" selected disabled>Seleccione un cliente.</option>
                </select>
              </div>

    <div class="form-group my-3">
        <label for="selectVehiculo" class="form-label"> Nombre del vehiculo</label>
        <input type="selectVehiculo" class="form-label">
   </div>
        
     <div class="form-group my-3">
        <label for="selectVehiculo" class="form-label">Reservas</label>
             <select id="selectVehiculo" class="form-select" required>
             <option value="" selected disabled>Seleccione un cliente</option>
             </select>
            </div>

         <div class="form-group my-3">
            <label for="txtNombreReserva" class="form-label">Nombre de la reserva</label>
         <input type="text" id="txtNombreReserva" class="form-control" placeholder="..." required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtFechaReserva" class="form-label">Fecha de Reserva</label>
                            <input type="date" id="txtFechaReserva" class="form-control" required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtCantidadPasajeros" class="form-label">Cantidad de Pasajeros</label>
                            <input type="number" id="txtCantidadPasajeros" class="form-control" placeholder="..." required>
                        </div>

                        <div class="form-group my-3">
                            <label for="txtCantidadDiaz" class="form-label">Cantidad de Diaz</label>
                            <input type="number" id="txtCantidadDiaz" class="form-control" placeholder="..." required>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                            <button type="submit" id="btnGuardar" class="btn btn-primary btn-lg">Guardar </button>
                            <button id="btnCancelar" class="btn btn-warning btn-lg d-none" type="button">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>

        <section class="card shadow-sm">
         <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0">Lista de Eventos</h2>
                <button id="btnRecargar" class="btn btn-light btn-sm"> Recargar</button>
        </div>

        <div class="card-body">

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <div id="cargando" class="text-center py-5">
             <div class="spinner-border text-primary" role="status">
                     <span class="visually-hidden">Cargando.</span>
                </div>
                    <p class="mt-3 text-muted">Cargando registros.</p>
            </div>

             <div class="table-responsive d-none" id="tableroContainer">
              <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                     <tr>
                        <th>ID</th>
                        <th>Reserva</th>
                         <th>Cliente</th>
                         <th>Vehiculos</th>
                        <th>Fecha</th>
                        <th>Personas</th>
                         <th>Horas</th>
                        <th>Total</th>
                        <th>Estado</th>
                     <th>Acciones</th>
                        </tr>
                    </thead>
                        <tbody id="tablaRegistros">
                             
                        </tbody>
                     </table>
                </div>

                </div>
            </section>

        </div>

    </main>
  <div class="modal fade" id="modalEstado" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Cambiar Estado</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalIdEvento">
                    <div class="mb-3">
                        <label for="selectNuevoEstado" class="form-label">Estado:</label>
                        <select class="form-select" id="selectNuevoEstado">
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="CONFIRMADO">Confirmado</option>
                            <option value="CANCELADO">Cancelada</option>
                            <option value="FINALIZADO">Finalizada</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-success" id="btnGuardarEstado">Actualizar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/controllers/clientesController.js"></script>
</body>

</html>
